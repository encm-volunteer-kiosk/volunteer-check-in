<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <!--
      The Hours report dialog, served by openMonthlyReportDialog (Reports.js) as a
      template. The server puts the dialog key and the Kiosk contact line into the body's
      data attributes, through the escaping print scriptlet; nothing else on the page is
      filled in by the server. Plain HTML and JavaScript, no build step. The Period choice
      shows one input row: a month, quarter or year list, two dates, or a hint for all time.
      The lists, their defaults and today all come in the adminReportMonths reply; the page
      reads no clock. Make sends the period and only that kind's fields; the server checks
      the period and the initials again. A date field's max limits only what the server
      refuses: From can't be after today, To can.
    -->
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        color: #202124;
        margin: 0;
        padding: 4px 8px 12px;
      }
      label {
        display: block;
        font-weight: bold;
        margin: 12px 0 4px;
      }
      .hint {
        font-weight: normal;
        color: #5f6368;
      }
      input,
      select {
        font: inherit;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid #dadce0;
        border-radius: 4px;
      }
      select {
        width: 100%;
      }
      .all-time {
        margin-top: 12px;
      }
      .dates {
        display: flex;
        gap: 12px;
      }
      .dates > div {
        flex: 1;
      }
      .dates input {
        width: 100%;
      }
      .initials {
        width: 8em;
        text-transform: uppercase;
      }
      .buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border-radius: 4px;
        border: 1px solid #dadce0;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #1a73e8;
        border-color: #1a73e8;
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .message {
        margin-top: 12px;
        padding: 8px;
        border-radius: 4px;
        display: none;
      }
      .message.error {
        display: block;
        background: #fce8e6;
        color: #a50e0e;
      }
      .message.ok {
        display: block;
        background: #e6f4ea;
        color: #0d652d;
      }
      .message.info {
        display: block;
        background: #f1f3f4;
      }
      .links {
        display: flex;
        gap: 16px;
        margin-top: 8px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body data-key="<?= key ?>" data-contact="<?= contactNote ?>">
    <form id="form">
      <label for="period">Period</label>
      <select id="period" disabled>
        <option value="month">Month</option>
        <option value="quarter">Quarter</option>
        <option value="year">Year</option>
        <option value="range">Date range</option>
        <option value="all">All time</option>
      </select>

      <div id="row-month">
        <label for="month">Month</label>
        <select id="month" disabled></select>
      </div>
      <div id="row-quarter" hidden>
        <label for="quarter">Quarter</label>
        <select id="quarter"></select>
      </div>
      <div id="row-year" hidden>
        <label for="year">Year</label>
        <select id="year"></select>
      </div>
      <div id="row-range" class="dates" hidden>
        <div>
          <label for="from">From</label>
          <input id="from" type="date" />
        </div>
        <div>
          <label for="to">To</label>
          <input id="to" type="date" />
        </div>
      </div>
      <div id="row-all" class="hint all-time" hidden>
        Every row in the Log with a readable Date.
      </div>

      <label for="initials">Your initials</label>
      <input id="initials" class="initials" type="text" maxlength="10" autocomplete="off" />
      <div class="hint">
        The report is written to a new tab. It counts closed shifts with a User Token, using stated
        hours.
      </div>
    </form>

    <div id="message" class="message" role="status"></div>
    <div id="links" class="links" hidden>
      <a id="csv" target="_blank" rel="noopener">Download CSV</a>
      <a id="pdf" target="_blank" rel="noopener">Download PDF</a>
    </div>

    <div class="buttons">
      <button type="button" id="close">Close</button>
      <button type="button" id="make" class="primary" disabled>Make report</button>
    </div>

    <script>
      const KEY = document.body.dataset.key;
      // Who to ask, added to an error: whatever reaches the failure handler and a reply
      // with no message. A refusal's own message is shown as it is.
      const CONTACT = document.body.dataset.contact || "";
      const $ = (id) => document.getElementById(id);
      const KINDS = ["month", "quarter", "year", "range", "all"];
      let busy = false;
      let loaded = false;

      // Shows the input row of the chosen kind and hides the others.
      function showKind() {
        const kind = $("period").value;
        KINDS.forEach((k) => ($("row-" + k).hidden = k !== kind));
      }

      function show(text, kind) {
        const box = $("message");
        box.textContent = text;
        box.className = "message " + (text ? kind : "");
      }

      function failed(text) {
        show(CONTACT ? text + " " + CONTACT : text, "error");
      }

      function setBusy(on) {
        busy = on;
        $("make").disabled = on || !loaded;
      }

      function call(name, args, onOk) {
        setBusy(true);
        google.script.run
          .withSuccessHandler((reply) => {
            setBusy(false);
            if (reply && reply.ok) onOk(reply);
            else if (reply && reply.message) show(reply.message, "error");
            else failed("Something went wrong. Please try again.");
          })
          .withFailureHandler((error) => {
            setBusy(false);
            failed((error && error.message) || String(error));
          })
          [name](KEY, ...args);
      }

      function fill(id, list, key, label, value) {
        const select = $(id);
        list.forEach((x) => select.add(new Option(label(x), x[key])));
        select.value = value;
        select.disabled = false;
      }

      function load() {
        $("period").value = "month";
        showKind();
        show("Loading…", "info");
        call("adminReportMonths", [], (reply) => {
          fill(
            "month",
            reply.months,
            "month",
            (m) => m.label + " (" + m.month + ")",
            reply.defaultMonth,
          );
          fill("quarter", reply.quarters, "quarter", (q) => q.label, reply.defaultQuarter);
          fill("year", reply.years, "year", (y) => y.label, reply.defaultYear);
          $("from").value = reply.today.slice(0, 4) + "-01-01";
          $("from").max = reply.today;
          $("to").value = reply.today;
          $("period").disabled = false;
          loaded = true;
          setBusy(false);
          show("", "");
        });
      }

      // The period and only the fields of its kind.
      function periodFields() {
        const period = $("period").value;
        if (period === "range") return { period, from: $("from").value, to: $("to").value };
        if (period === "all") return { period };
        const fields = { period };
        fields[period] = $(period).value;
        return fields;
      }

      function make() {
        if (busy || !loaded) return;
        const form = { ...periodFields(), initials: $("initials").value };
        if (form.period === "month" && !form.month) return show("Please choose a month.", "error");
        $("links").hidden = true;
        show("Making the report…", "info");
        call("adminMonthlyReport", [form], (reply) => {
          show("Report written to the tab " + reply.tabName + ".", "ok");
          $("csv").href = reply.csvUrl;
          $("pdf").href = reply.pdfUrl;
          $("links").hidden = false;
        });
      }

      $("period").addEventListener("change", showKind);
      $("make").addEventListener("click", make);
      $("close").addEventListener("click", () => google.script.host.close());
      $("form").addEventListener("submit", (event) => {
        event.preventDefault();
        make();
      });
      load();
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <!--
      The Kiosk admin dialogs, served by openAdminDialog_ (Admin.js) as a template. The
      server puts the dialog key and the mode ("add", "fix", "remove" or "restore") into the
      body's data
      attributes; nothing else on the page is filled in by the server. Plain HTML and
      JavaScript, no build step. Every limit shown here is checked again on the server.
    -->
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        color: #202124;
        margin: 0;
        padding: 4px 8px 12px;
      }
      label {
        display: block;
        font-weight: bold;
        margin: 12px 0 4px;
      }
      .hint {
        font-weight: normal;
        color: #5f6368;
      }
      input,
      select,
      textarea {
        font: inherit;
        box-sizing: border-box;
        width: 100%;
        padding: 6px;
        border: 1px solid #dadce0;
        border-radius: 4px;
      }
      select[size] {
        padding: 0;
      }
      textarea {
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row > div {
        flex: 1;
      }
      .initials {
        width: 8em;
        text-transform: uppercase;
      }
      .buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border-radius: 4px;
        border: 1px solid #dadce0;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #1a73e8;
        border-color: #1a73e8;
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .message {
        margin-top: 12px;
        padding: 8px;
        border-radius: 4px;
        display: none;
      }
      .message.error {
        display: block;
        background: #fce8e6;
        color: #a50e0e;
      }
      .message.ok {
        display: block;
        background: #e6f4ea;
        color: #0d652d;
      }
      .message.info {
        display: block;
        background: #f1f3f4;
      }
      .detail {
        white-space: pre-wrap;
        font: inherit;
        font-size: 13px;
        background: #f8f9fa;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 6px 8px;
        margin: 8px 0 0;
      }
      .detail:empty {
        display: none;
      }
      .find {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body data-key="<?= key ?>" data-mode="<?= mode ?>">
    <form id="add" hidden>
      <label for="add-search">Volunteer <span class="hint">(type to search)</span></label>
      <input id="add-search" type="search" autocomplete="off" />
      <select id="add-volunteer" size="6" aria-label="Volunteer"></select>

      <div class="row">
        <div>
          <label for="add-date">Date</label>
          <input id="add-date" type="date" required />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="add-in">Check-in time</label>
          <input id="add-in" type="time" required />
        </div>
        <div>
          <label for="add-out">Check-out time</label>
          <input id="add-out" type="time" required />
        </div>
      </div>
    </form>

    <form id="fix" hidden>
      <label for="fix-search">Open shift <span class="hint">(type to search)</span></label>
      <input id="fix-search" type="search" autocomplete="off" />
      <select id="fix-shift" size="6" aria-label="Open shift"></select>

      <label for="fix-out">Check-out time <span class="hint">(on the shift's date)</span></label>
      <input id="fix-out" type="time" required />
    </form>

    <form id="remove" hidden>
      <label for="remove-id"
        >Shift ID
        <span class="hint">(paste it, or find the shift by volunteer and date)</span></label
      >
      <input id="remove-id" type="text" autocomplete="off" />
      <label for="remove-search">Volunteer <span class="hint">(type to search)</span></label>
      <input id="remove-search" type="search" autocomplete="off" />
      <select id="remove-volunteer" size="4" aria-label="Volunteer"></select>
      <div class="row">
        <div>
          <label for="remove-date">Date</label>
          <input id="remove-date" type="date" />
        </div>
      </div>
      <div class="find"><button type="button" id="remove-find">Find</button></div>

      <label for="remove-shift">Shift to remove</label>
      <select id="remove-shift" size="4" aria-label="Shift to remove"></select>
      <div class="detail" id="remove-detail"></div>
    </form>

    <form id="restore" hidden>
      <label for="restore-search">Removed shift <span class="hint">(type to search)</span></label>
      <input id="restore-search" type="search" autocomplete="off" />
      <select id="restore-shift" size="6" aria-label="Removed shift"></select>
      <div class="detail" id="restore-detail"></div>
    </form>

    <div id="common" hidden>
      <div id="note-block">
        <label for="note" id="note-label"
          >Note <span class="hint">(optional, goes in the Notes column)</span></label
        >
        <textarea id="note" rows="3" maxlength="500"></textarea>
        <div class="hint" id="note-count">0 / 500</div>
      </div>

      <label for="initials">Your initials</label>
      <input id="initials" class="initials" type="text" maxlength="10" autocomplete="off" />
    </div>

    <div id="message" class="message" role="status"></div>

    <div class="buttons">
      <button type="button" id="close">Close</button>
      <button type="button" id="save" class="primary" disabled>Save</button>
    </div>

    <script>
      const KEY = document.body.dataset.key;
      const MODES = ["add", "fix", "remove", "restore"];
      const MODE = MODES.includes(document.body.dataset.mode) ? document.body.dataset.mode : "add";
      const $ = (id) => document.getElementById(id);
      const REFRESH_TEXT =
        " Hours shows this after its next refresh (about 5 AM, or Kiosk admin > Refresh Hours).";
      // add and remove: the volunteer roster. fix: the open shifts. restore: the Removed rows.
      let choices = [];
      // remove: the rows Find returned.
      let found = [];
      let busy = false;

      function show(text, kind) {
        const box = $("message");
        box.textContent = text;
        box.className = "message " + (text ? kind : "");
      }

      // name search: begin
      // The search ignores Latin accents, apostrophes, periods, hyphens, case and spacing.
      // fold() is a copy of fold() in src/nameSearch.ts, which the tablet's name box uses;
      // tests/nameSearch.test.mjs runs the code between these two comments and holds the
      // copies to the same output. Change both together. Self-contained, so the test can
      // run it alone.
      function fold(text) {
        const letters = {
          "\u00DF": "ss",
          "\u00E6": "ae",
          "\u0153": "oe",
          "\u00F8": "o",
          "\u0111": "d",
          "\u00F0": "d",
          "\u0142": "l",
          "\u00FE": "th",
          "\u0131": "i",
        };
        return String(text)
          .replace(/[\u00A8\u00AF\u00B4\u00B8\u02B9\u02BB\u02BC\u02D8-\u02DD\u0374\p{Cf}]/gu, "")
          .normalize("NFKD")
          .replace(/(\p{L})?(\p{M}+)/gu, (run, base) =>
            base && !/\p{Script=Latin}/u.test(base) ? run : base || "",
          )
          .toLowerCase()
          .replace(/[\u00DF\u00E6\u0153\u00F8\u0111\u00F0\u0142\u00FE\u0131]/g, (c) => letters[c])
          .replace(/['\u2019\u2018\u02BC\u02BB`.\u2032\u02B9\p{Cf}]/gu, "")
          .replace(/[-\u2010-\u2015\u2212_]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      // True when every word of the query is in the label, or in the label with its spaces
      // taken out ("marykate" finds "Mary-Kate"). A query with no words keeps every item.
      function labelMatches(label, query) {
        const words = fold(query).split(" ").filter(Boolean);
        const folded = fold(label);
        const joined = folded.replace(/ /g, "");
        return words.every((w) => folded.includes(w) || joined.includes(w));
      }
      // name search: end

      function fillList(select, search, items, valueKey) {
        const kept = select.value;
        select.textContent = "";
        items
          .filter((item) => labelMatches(item.label, search.value))
          .forEach((item) => select.add(new Option(item.label, item[valueKey])));
        if (kept) select.value = kept;
        if (!select.value && select.options.length === 1) select.selectedIndex = 0;
      }

      function refill() {
        if (MODE === "add") fillList($("add-volunteer"), $("add-search"), choices, "id");
        else if (MODE === "fix") fillList($("fix-shift"), $("fix-search"), choices, "shiftId");
        else if (MODE === "remove") {
          fillList($("remove-volunteer"), $("remove-search"), choices, "id");
        } else {
          fillList($("restore-shift"), $("restore-search"), choices, "key");
          showDetail();
        }
      }

      // Remove and Restore list rows by Shift ID and Log row, since a Shift ID can be on two
      // rows.
      function keyed(shifts) {
        return shifts.map((s) => ({ ...s, key: s.shiftId + "|" + s.row }));
      }

      function picked() {
        const list = MODE === "remove" ? found : choices;
        const key = $(MODE + "-shift").value;
        return list.find((s) => s.key === key) || null;
      }

      function showDetail() {
        const shift = picked();
        $(MODE + "-detail").textContent = shift ? shift.detail : "";
      }

      function setFound(shifts) {
        found = keyed(shifts);
        const select = $("remove-shift");
        select.textContent = "";
        found.forEach((s) => select.add(new Option(s.label, s.key)));
        if (found.length === 1) select.selectedIndex = 0;
        showDetail();
      }

      function find() {
        if (busy) return;
        const shiftId = $("remove-id").value.trim();
        let query;
        if (shiftId) query = { shiftId };
        else {
          query = { id: $("remove-volunteer").value, date: $("remove-date").value };
          if (!query.id)
            return show("Paste a Shift ID, or choose a volunteer and a date.", "error");
          if (!query.date) return show("Please enter the date.", "error");
        }
        show("Looking…", "info");
        call("adminFindShifts", [query], (reply) => {
          setFound(reply.shifts);
          show(reply.shifts.length ? "" : "No Log row with a Shift ID matches.", "info");
        });
      }

      function whose(reply) {
        return reply.name ? reply.name + "'s shift" : "The shift";
      }

      function call(name, args, onOk) {
        busy = true;
        $("save").disabled = true;
        google.script.run
          .withSuccessHandler((reply) => {
            busy = false;
            $("save").disabled = false;
            if (reply && reply.ok) onOk(reply);
            else
              show((reply && reply.message) || "Something went wrong. Please try again.", "error");
          })
          .withFailureHandler((error) => {
            busy = false;
            $("save").disabled = false;
            show((error && error.message) || String(error), "error");
          })
          [name](KEY, ...args);
      }

      function load() {
        show("Loading…", "info");
        if (MODE === "add") {
          call("adminRoster", [], (reply) => {
            choices = reply.volunteers;
            $("add-date").value = reply.today;
            $("add-date").max = reply.today;
            refill();
            show("", "");
          });
        } else if (MODE === "fix") {
          call("adminOpenShifts", [], (reply) => {
            choices = reply.shifts;
            refill();
            show(choices.length ? "" : "There are no open shifts to fix.", "info");
          });
        } else if (MODE === "remove") {
          call("adminRoster", [], (reply) => {
            choices = reply.volunteers;
            $("remove-date").value = reply.today;
            $("remove-date").max = reply.today;
            refill();
            show("", "");
          });
        } else {
          loadRemoved("");
        }
      }

      function loadRemoved(done) {
        call("adminRemovedShifts", [], (reply) => {
          choices = keyed(reply.shifts);
          refill();
          if (done) show(done, "ok");
          else show(choices.length ? "" : "There are no removed shifts to restore.", "info");
        });
      }

      function flagsText(reply) {
        if (reply.flagsFailed) {
          return " Its Flags rows couldn't be ticked; tick them by hand on the Flags tab.";
        }
        let text = " " + reply.flagsMarked + " Flags row(s) ticked Reviewed.";
        if (reply.flagsLeft) {
          text +=
            " " +
            reply.flagsLeft +
            " left unticked, for the other Log row that still has this Shift ID.";
        }
        return text;
      }

      function hoursText(hours) {
        return typeof hours === "number" ? hours.toFixed(2) + " hours" : "hours left blank";
      }

      function save() {
        if (busy) return;
        const common = { note: $("note").value, initials: $("initials").value };
        if (MODE === "add") {
          const form = {
            id: $("add-volunteer").value,
            date: $("add-date").value,
            inTime: $("add-in").value,
            outTime: $("add-out").value,
            ...common,
          };
          if (!form.id) return show("Please choose a volunteer.", "error");
          if (!form.date || !form.inTime || !form.outTime) {
            return show("Please enter the date and both times.", "error");
          }
          call("adminAddShift", [form], (reply) => {
            show(
              "Saved on Log row " +
                reply.row +
                ": " +
                reply.name +
                ", " +
                hoursText(reply.hours) +
                ".",
              "ok",
            );
            $("add-in").value = "";
            $("add-out").value = "";
            $("note").value = "";
            updateCount();
          });
        } else if (MODE === "remove") {
          const shift = picked();
          if (!shift) return show("Please find and choose the shift to remove.", "error");
          const form = {
            shiftId: shift.shiftId,
            row: shift.row,
            reason: common.note,
            initials: common.initials,
          };
          if (!form.reason.trim()) return show("Please enter a reason.", "error");
          call("adminRemoveShift", [form], (reply) => {
            show(
              whose(reply) +
                " on " +
                (reply.date || "no date") +
                " is on the Removed shifts tab now." +
                flagsText(reply) +
                REFRESH_TEXT,
              "ok",
            );
            setFound([]);
            $("note").value = "";
            updateCount();
          });
        } else if (MODE === "restore") {
          const shift = picked();
          if (!shift) return show("Please choose a removed shift.", "error");
          const form = { shiftId: shift.shiftId, row: shift.row, initials: common.initials };
          call("adminRestoreShift", [form], (reply) => {
            const done =
              whose(reply) +
              " on " +
              (reply.date || "no date") +
              " is back on Log row " +
              reply.logRow +
              "." +
              (reply.flagsFailed ? " Its Flags rows didn't get the restore note." : "") +
              REFRESH_TEXT;
            loadRemoved(done);
          });
        } else {
          const form = { shiftId: $("fix-shift").value, outTime: $("fix-out").value, ...common };
          if (!form.shiftId) return show("Please choose an open shift.", "error");
          if (!form.outTime) return show("Please enter the check-out time.", "error");
          call("adminFixSignOut", [form], (reply) => {
            const done =
              "Closed Log row " +
              reply.row +
              ": " +
              (reply.name || "no name") +
              ", " +
              hoursText(reply.hours) +
              ".";
            $("fix-out").value = "";
            $("note").value = "";
            updateCount();
            call("adminOpenShifts", [], (list) => {
              choices = list.shifts;
              refill();
              show(done, "ok");
            });
          });
        }
      }

      function updateCount() {
        $("note-count").textContent = $("note").value.length + " / 500";
      }

      $(MODE).hidden = false;
      $("common").hidden = false;
      if (MODE === "remove") {
        $("note-label").innerHTML =
          'Reason <span class="hint">(required, kept on the Removed shifts tab)</span>';
      }
      if (MODE === "restore") $("note-block").hidden = true;
      $("add-search").addEventListener("input", refill);
      $("fix-search").addEventListener("input", refill);
      $("remove-search").addEventListener("input", refill);
      $("restore-search").addEventListener("input", refill);
      $("remove-find").addEventListener("click", find);
      $("remove-shift").addEventListener("change", showDetail);
      $("restore-shift").addEventListener("change", showDetail);
      $("note").addEventListener("input", updateCount);
      $("save").addEventListener("click", save);
      $("close").addEventListener("click", () => google.script.host.close());
      document
        .querySelectorAll("form")
        .forEach((f) => f.addEventListener("submit", (event) => event.preventDefault()));
      load();
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <!--
      The Kiosk admin dialogs, served by openAdminDialog_ (Admin.js) as a template. The
      server puts the dialog key, the mode ("add", "fix", "remove", "restore" or "email")
      and the Kiosk contact line into the body's data attributes, through the escaping
      print scriptlet; nothing else on the page is filled in by the server. Plain HTML and
      JavaScript, no build step. Every limit shown here is checked again on the server.
    -->
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        color: #202124;
        margin: 0;
        padding: 4px 8px 12px;
      }
      label {
        display: block;
        font-weight: bold;
        margin: 12px 0 4px;
      }
      .hint {
        font-weight: normal;
        color: #5f6368;
      }
      input,
      select,
      textarea {
        font: inherit;
        box-sizing: border-box;
        width: 100%;
        padding: 6px;
        border: 1px solid #dadce0;
        border-radius: 4px;
      }
      select[size] {
        padding: 0;
      }
      textarea {
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row > div {
        flex: 1;
      }
      .initials {
        width: 8em;
        text-transform: uppercase;
      }
      .buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border-radius: 4px;
        border: 1px solid #dadce0;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #1a73e8;
        border-color: #1a73e8;
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .message {
        margin-top: 12px;
        padding: 8px;
        border-radius: 4px;
        display: none;
      }
      .message.error {
        display: block;
        background: #fce8e6;
        color: #a50e0e;
      }
      .message.ok {
        display: block;
        background: #e6f4ea;
        color: #0d652d;
      }
      .message.info {
        display: block;
        background: #f1f3f4;
      }
      .detail {
        white-space: pre-wrap;
        font: inherit;
        font-size: 13px;
        background: #f8f9fa;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 6px 8px;
        margin: 8px 0 0;
      }
      .detail:empty {
        display: none;
      }
      .find {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .heading {
        font-weight: bold;
        margin: 12px 0 4px;
      }
      label.tick {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: normal;
        margin: 0;
        padding: 2px 0;
        line-height: 20px;
      }
      label.tick input {
        width: auto;
        margin: 0;
      }
      .ticks {
        height: 192px;
        overflow-y: auto;
        margin-top: 4px;
        padding: 0 6px;
        border: 1px solid #dadce0;
        border-radius: 4px;
      }
      .tick-buttons {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .tick-buttons .hint {
        margin-left: auto;
      }
      .preview {
        max-height: 180px;
        overflow: auto;
      }
      .preview > div + div {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #dadce0;
      }
      .preview summary {
        cursor: pointer;
        color: #1a73e8;
      }
      .check {
        margin-top: 8px;
        padding: 8px;
        border-radius: 4px;
        background: #fef7e0;
        color: #7a4f01;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body data-key="<?= key ?>" data-mode="<?= mode ?>" data-contact="<?= contactNote ?>">
    <form id="add" hidden>
      <label for="add-search">Volunteer <span class="hint">(type to search)</span></label>
      <input id="add-search" type="search" autocomplete="off" />
      <select id="add-volunteer" size="6" aria-label="Volunteer"></select>

      <div class="row">
        <div>
          <label for="add-date">Date</label>
          <input id="add-date" type="date" required />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="add-in">Check-in time</label>
          <input id="add-in" type="time" required />
        </div>
        <div>
          <label for="add-out">Check-out time</label>
          <input id="add-out" type="time" required />
        </div>
      </div>
    </form>

    <form id="fix" hidden>
      <label for="fix-search">Open shift <span class="hint">(type to search)</span></label>
      <input id="fix-search" type="search" autocomplete="off" />
      <select id="fix-shift" size="6" aria-label="Open shift"></select>

      <label for="fix-out">Check-out time <span class="hint">(on the shift's date)</span></label>
      <input id="fix-out" type="time" required />
    </form>

    <form id="remove" hidden>
      <label for="remove-id"
        >Shift ID
        <span class="hint">(paste it, or find the shift by volunteer and date)</span></label
      >
      <input id="remove-id" type="text" autocomplete="off" />
      <label for="remove-search">Volunteer <span class="hint">(type to search)</span></label>
      <input id="remove-search" type="search" autocomplete="off" />
      <select id="remove-volunteer" size="4" aria-label="Volunteer"></select>
      <div class="row">
        <div>
          <label for="remove-date">Date</label>
          <input id="remove-date" type="date" />
        </div>
      </div>
      <div class="find"><button type="button" id="remove-find">Find</button></div>

      <label for="remove-shift">Shift to remove</label>
      <select id="remove-shift" size="4" aria-label="Shift to remove"></select>
      <div class="detail" id="remove-detail"></div>
    </form>

    <form id="restore" hidden>
      <label for="restore-search">Removed shift <span class="hint">(type to search)</span></label>
      <input id="restore-search" type="search" autocomplete="off" />
      <select id="restore-shift" size="6" aria-label="Removed shift"></select>
      <div class="detail" id="restore-detail"></div>
    </form>

    <form id="email" hidden>
      <div class="heading">Month</div>
      <label class="tick"
        ><input type="radio" name="email-month" id="email-this" value="this" checked />
        <span id="email-this-label">This month</span></label
      >
      <label class="tick"
        ><input type="radio" name="email-month" id="email-last" value="last" />
        <span id="email-last-label">Last month</span></label
      >
      <label class="tick"
        ><input type="checkbox" id="email-attach" /> Attach all shifts as a spreadsheet file
        (CSV)</label
      >

      <label for="email-search">Volunteers <span class="hint">(type to search)</span></label>
      <input id="email-search" type="search" autocomplete="off" />
      <div id="email-list" class="ticks" role="group" aria-label="Volunteers"></div>
      <div class="tick-buttons">
        <button type="button" id="email-tick-all">Tick all shown</button>
        <button type="button" id="email-clear">Clear</button>
        <span class="hint" id="email-count">0 ticked</span>
      </div>
      <div class="find"><button type="button" id="email-preview">Preview</button></div>

      <div class="check" id="email-check" hidden></div>
      <div class="detail preview" id="email-detail"></div>
    </form>

    <div id="common" hidden>
      <div id="note-block">
        <label for="note" id="note-label"
          >Note <span class="hint">(optional, goes in the Notes column)</span></label
        >
        <textarea id="note" rows="3" maxlength="500"></textarea>
        <div class="hint" id="note-count">0 / 500</div>
      </div>

      <label for="initials">Your initials</label>
      <input id="initials" class="initials" type="text" maxlength="10" autocomplete="off" />
    </div>

    <div id="message" class="message" role="status"></div>

    <div class="buttons">
      <button type="button" id="close">Close</button>
      <button type="button" id="save" class="primary" disabled>Save</button>
    </div>

    <script>
      const KEY = document.body.dataset.key;
      // Who to ask, added to an error: whatever reaches the failure handler and a reply
      // with no message. A refusal's own message is shown as it is.
      const CONTACT = document.body.dataset.contact || "";
      const MODES = ["add", "fix", "remove", "restore", "email"];
      const MODE = MODES.includes(document.body.dataset.mode) ? document.body.dataset.mode : "add";
      const $ = (id) => document.getElementById(id);
      const REFRESH_TEXT =
        " Hours shows this after its next refresh (about 5 AM, or Kiosk admin > Refresh Hours).";
      // add, remove and email: the volunteer roster. fix: the open shifts. restore: the
      // Removed rows.
      let choices = [];
      // remove: the rows Find returned.
      let found = [];
      // True while a call is in flight.
      let busy = false;
      // email: the ticked Volunteer IDs, kept while the search hides their rows, and the
      // tick boxes drawn now.
      const ticked = new Set();
      let boxes = [];
      // email: "" or {id, key, pending}, the ticket of the last Preview, the selection key
      // it was made for and the ids the Send still has to handle. Only setTicket() writes
      // it, except that a send reply takes the ids it handled out of pending.
      let ticket = "";
      // email: the Preview reply the ticket came from, which labels the send results.
      let shown = null;
      // email: true from a Send press until its run of calls ends, and that run.
      let running = false;
      let run = null;

      // email: how many a send run sent, put before the next message shown, which is the
      // reply that ended the run.
      let runCount = "";

      // In email mode every message is scrolled into view, so the result of the last press
      // is never below the fold.
      function show(text, kind) {
        if (runCount) {
          text = text ? runCount + " " + text : runCount;
          runCount = "";
        }
        const box = $("message");
        box.textContent = text;
        box.className = "message " + (text ? kind : "");
        if (MODE === "email") box.scrollIntoView({ block: "nearest" });
      }

      function failed(text) {
        show(CONTACT ? text + " " + CONTACT : text, "error");
      }

      // name search: begin
      // The search ignores Latin accents, apostrophes, periods, hyphens, case and spacing.
      // fold() is a copy of fold() in src/nameSearch.ts, which the tablet's name box uses;
      // tests/nameSearch.test.mjs runs the code between these two comments and holds the
      // copies to the same output. Change both together. Self-contained, so the test can
      // run it alone.
      function fold(text) {
        const letters = {
          "\u00DF": "ss",
          "\u00E6": "ae",
          "\u0153": "oe",
          "\u00F8": "o",
          "\u0111": "d",
          "\u00F0": "d",
          "\u0142": "l",
          "\u00FE": "th",
          "\u0131": "i",
        };
        return String(text)
          .replace(/[\u00A8\u00AF\u00B4\u00B8\u02B9\u02BB\u02BC\u02D8-\u02DD\u0374\p{Cf}]/gu, "")
          .normalize("NFKD")
          .replace(/(\p{L})?(\p{M}+)/gu, (run, base) =>
            base && !/\p{Script=Latin}/u.test(base) ? run : base || "",
          )
          .toLowerCase()
          .replace(/[\u00DF\u00E6\u0153\u00F8\u0111\u00F0\u0142\u00FE\u0131]/g, (c) => letters[c])
          .replace(/['\u2019\u2018\u02BC\u02BB`.\u2032\u02B9\p{Cf}]/gu, "")
          .replace(/[-\u2010-\u2015\u2212_]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      // True when every word of the query is in the label, or in the label with its spaces
      // taken out ("marykate" finds "Mary-Kate"). A query with no words keeps every item.
      function labelMatches(label, query) {
        const words = fold(query).split(" ").filter(Boolean);
        const folded = fold(label);
        const joined = folded.replace(/ /g, "");
        return words.every((w) => folded.includes(w) || joined.includes(w));
      }
      // name search: end

      function fillList(select, search, items, valueKey) {
        const kept = select.value;
        select.textContent = "";
        items
          .filter((item) => labelMatches(item.label, search.value))
          .forEach((item) => select.add(new Option(item.label, item[valueKey])));
        if (kept) select.value = kept;
        if (!select.value && select.options.length === 1) select.selectedIndex = 0;
      }

      function refill() {
        if (MODE === "add") fillList($("add-volunteer"), $("add-search"), choices, "id");
        else if (MODE === "fix") fillList($("fix-shift"), $("fix-search"), choices, "shiftId");
        else if (MODE === "remove") {
          fillList($("remove-volunteer"), $("remove-search"), choices, "id");
        } else if (MODE === "email") {
          drawTicks();
        } else {
          fillList($("restore-shift"), $("restore-search"), choices, "key");
          showDetail();
        }
      }

      // Remove and Restore list rows by Shift ID and Log row, since a Shift ID can be on two
      // rows.
      function keyed(shifts) {
        return shifts.map((s) => ({ ...s, key: s.shiftId + "|" + s.row }));
      }

      function picked() {
        const list = MODE === "remove" ? found : choices;
        const key = $(MODE + "-shift").value;
        return list.find((s) => s.key === key) || null;
      }

      function showDetail() {
        const shift = picked();
        $(MODE + "-detail").textContent = shift ? shift.detail : "";
      }

      function setFound(shifts) {
        found = keyed(shifts);
        const select = $("remove-shift");
        select.textContent = "";
        found.forEach((s) => select.add(new Option(s.label, s.key)));
        if (found.length === 1) select.selectedIndex = 0;
        showDetail();
      }

      function find() {
        if (busy) return;
        const shiftId = $("remove-id").value.trim();
        let query;
        if (shiftId) query = { shiftId };
        else {
          query = { id: $("remove-volunteer").value, date: $("remove-date").value };
          if (!query.id)
            return show("Paste a Shift ID, or choose a volunteer and a date.", "error");
          if (!query.date) return show("Please enter the date.", "error");
        }
        show("Looking…", "info");
        call("adminFindShifts", [query], (reply) => {
          setFound(reply.shifts);
          show(reply.shifts.length ? "" : "No Log row with a Shift ID matches.", "info");
        });
      }

      function whose(reply) {
        return reply.name ? reply.name + "'s shift" : "The shift";
      }

      // The one place that writes the primary button's disabled. In email mode it also
      // turns every control that changes the selection off while a call is in flight or a
      // send run is under way, so the selection can't change under a pending reply.
      function buttonState() {
        if (MODE !== "email") {
          $("save").disabled = busy;
          return;
        }
        const off = busy || running;
        $("save").disabled = off || !ticket;
        const controls = ["email-this", "email-last", "email-attach", "email-search"];
        controls.push("email-tick-all", "email-clear", "email-preview");
        controls.forEach((id) => ($(id).disabled = off));
        boxes.forEach((box) => (box.disabled = off));
      }

      // In email mode afterReply runs before the button is set: it moves a send run on, or
      // ends it.
      function call(name, args, onOk) {
        busy = true;
        buttonState();
        google.script.run
          .withSuccessHandler((reply) => {
            busy = false;
            if (MODE === "email") afterReply(name, reply, false);
            buttonState();
            if (reply && reply.ok) onOk(reply);
            else if (reply && reply.message) show(reply.message, "error");
            else failed("Something went wrong. Please try again.");
          })
          .withFailureHandler((error) => {
            busy = false;
            if (MODE === "email") afterReply(name, null, true, error);
            buttonState();
            failed((error && error.message) || String(error));
          })
          [name](KEY, ...args);
      }

      function load() {
        show("Loading…", "info");
        if (MODE === "add") {
          call("adminRoster", [], (reply) => {
            choices = reply.volunteers;
            $("add-date").value = reply.today;
            $("add-date").max = reply.today;
            refill();
            show("", "");
          });
        } else if (MODE === "fix") {
          call("adminOpenShifts", [], (reply) => {
            choices = reply.shifts;
            refill();
            show(choices.length ? "" : "There are no open shifts to fix.", "info");
          });
        } else if (MODE === "remove") {
          call("adminRoster", [], (reply) => {
            choices = reply.volunteers;
            $("remove-date").value = reply.today;
            $("remove-date").max = reply.today;
            refill();
            show("", "");
          });
        } else if (MODE === "email") {
          call("adminRoster", [], (reply) => {
            choices = reply.volunteers;
            nameMonths(reply.today);
            refill();
            show("", "");
          });
        } else {
          loadRemoved("");
        }
      }

      function loadRemoved(done) {
        call("adminRemovedShifts", [], (reply) => {
          choices = keyed(reply.shifts);
          refill();
          if (done) show(done, "ok");
          else show(choices.length ? "" : "There are no removed shifts to restore.", "info");
        });
      }

      function flagsText(reply) {
        if (reply.flagsFailed) {
          return " Its Flags rows couldn't be ticked; tick them by hand on the Flags tab.";
        }
        let text = " " + reply.flagsMarked + " Flags row(s) ticked Reviewed.";
        if (reply.flagsLeft) {
          text +=
            " " +
            reply.flagsLeft +
            " left unticked, for the other Log row that still has this Shift ID.";
        }
        return text;
      }

      function hoursText(hours) {
        return typeof hours === "number" ? hours.toFixed(2) + " hours" : "hours left blank";
      }

      function save() {
        if (busy) return;
        if (MODE === "email") return send();
        const common = { note: $("note").value, initials: $("initials").value };
        if (MODE === "add") {
          const form = {
            id: $("add-volunteer").value,
            date: $("add-date").value,
            inTime: $("add-in").value,
            outTime: $("add-out").value,
            ...common,
          };
          if (!form.id) return show("Please choose a volunteer.", "error");
          if (!form.date || !form.inTime || !form.outTime) {
            return show("Please enter the date and both times.", "error");
          }
          call("adminAddShift", [form], (reply) => {
            show(
              "Saved on Log row " +
                reply.row +
                ": " +
                reply.name +
                ", " +
                hoursText(reply.hours) +
                ".",
              "ok",
            );
            $("add-in").value = "";
            $("add-out").value = "";
            $("note").value = "";
            updateCount();
          });
        } else if (MODE === "remove") {
          const shift = picked();
          if (!shift) return show("Please find and choose the shift to remove.", "error");
          const form = {
            shiftId: shift.shiftId,
            row: shift.row,
            reason: common.note,
            initials: common.initials,
          };
          if (!form.reason.trim()) return show("Please enter a reason.", "error");
          call("adminRemoveShift", [form], (reply) => {
            show(
              whose(reply) +
                " on " +
                (reply.date || "no date") +
                " is on the Removed shifts tab now." +
                flagsText(reply) +
                REFRESH_TEXT,
              "ok",
            );
            setFound([]);
            $("note").value = "";
            updateCount();
          });
        } else if (MODE === "restore") {
          const shift = picked();
          if (!shift) return show("Please choose a removed shift.", "error");
          const form = { shiftId: shift.shiftId, row: shift.row, initials: common.initials };
          call("adminRestoreShift", [form], (reply) => {
            const done =
              whose(reply) +
              " on " +
              (reply.date || "no date") +
              " is back on Log row " +
              reply.logRow +
              "." +
              (reply.flagsFailed ? " Its Flags rows didn't get the restore note." : "") +
              REFRESH_TEXT;
            loadRemoved(done);
          });
        } else {
          const form = { shiftId: $("fix-shift").value, outTime: $("fix-out").value, ...common };
          if (!form.shiftId) return show("Please choose an open shift.", "error");
          if (!form.outTime) return show("Please enter the check-out time.", "error");
          call("adminFixSignOut", [form], (reply) => {
            const done =
              "Closed Log row " +
              reply.row +
              ": " +
              (reply.name || "no name") +
              ", " +
              hoursText(reply.hours) +
              ".";
            $("fix-out").value = "";
            $("note").value = "";
            updateCount();
            call("adminOpenShifts", [], (list) => {
              choices = list.shifts;
              refill();
              show(done, "ok");
            });
          });
        }
      }

      // ---- Email hours ----

      const MONTH_NAMES = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];

      // The two month choices, named from the server's today (yyyy-mm-dd, Central). The
      // server works the month out again from its own clock at Preview and at Send.
      function nameMonths(today) {
        const m = /^(\d{4})-(\d{2})-\d{2}$/.exec(String(today || ""));
        if (!m) return;
        const year = Number(m[1]);
        const month = Number(m[2]);
        const last = month === 1 ? [year - 1, 12] : [year, month - 1];
        $("email-this-label").textContent =
          "This month (" + MONTH_NAMES[month - 1] + " " + year + ")";
        $("email-last-label").textContent =
          "Last month (" + MONTH_NAMES[last[1] - 1] + " " + last[0] + ")";
      }

      // Redraws the tick boxes from the roster and the ticked set. The search only hides
      // and shows rows: a ticked row stays ticked, and counted, while it is hidden.
      function drawTicks() {
        const list = $("email-list");
        const query = $("email-search").value;
        list.textContent = "";
        boxes = choices.map((volunteer) => {
          const row = document.createElement("label");
          row.className = "tick";
          row.hidden = !labelMatches(volunteer.label, query);
          const box = document.createElement("input");
          box.type = "checkbox";
          box.checked = ticked.has(volunteer.id);
          box.addEventListener("change", () => {
            if (box.checked) ticked.add(volunteer.id);
            else ticked.delete(volunteer.id);
            selectionChanged();
          });
          const name = document.createElement("span");
          name.textContent = volunteer.label;
          row.appendChild(box);
          row.appendChild(name);
          list.appendChild(row);
          return box;
        });
        buttonState();
      }

      function tickAllShown() {
        if (busy || running) return;
        const query = $("email-search").value;
        choices.forEach((v) => {
          if (labelMatches(v.label, query)) ticked.add(v.id);
        });
        drawTicks();
        selectionChanged();
      }

      function clearTicks() {
        if (busy || running) return;
        ticked.clear();
        drawTicks();
        selectionChanged();
      }

      // The ticked ids in roster order.
      function tickedIds() {
        return choices.filter((v) => ticked.has(v.id)).map((v) => v.id);
      }

      function monthChoice() {
        return $("email-last").checked ? "last" : "this";
      }

      // The selection a ticket is made for: the ticked ids, the month and the attach box.
      // The search box is not part of it.
      function selectionKey() {
        return JSON.stringify([tickedIds().sort(), monthChoice(), $("email-attach").checked]);
      }

      function setTicket(t) {
        ticket = t;
        buttonState();
      }

      // Drops the ticket, the preview or result list, and the check line.
      function forgetPreview() {
        setTicket("");
        shown = null;
        $("email-detail").textContent = "";
        $("email-check").textContent = "";
        $("email-check").hidden = true;
      }

      // Any change of the ticked set, the month or the attach box.
      function selectionChanged() {
        forgetPreview();
        $("email-count").textContent = ticked.size + " ticked";
        show("", "");
      }

      function preview() {
        if (busy || running) return;
        const ids = tickedIds();
        if (!ids.length) return show("Please tick at least one volunteer.", "error");
        forgetPreview();
        const key = selectionKey();
        const form = { ids, choice: monthChoice(), attach: $("email-attach").checked };
        show("Making the preview…", "info");
        call("adminHoursPreview", [form], (reply) => {
          if (selectionKey() !== key) {
            return show("The ticked volunteers changed. Press Preview again.", "info");
          }
          shown = reply;
          drawPreview(reply);
          const pending = (reply.sendIds || []).slice();
          setTicket(reply.ticket ? { id: reply.ticket, key, pending } : "");
          if (ticket) {
            show("Check the preview, then type your initials and press Send email.", "info");
          } else {
            const why = texts(reply.setProblems).join(" ");
            show(why || "None of the ticked volunteers can be sent; see the preview.", "error");
          }
        });
      }

      // Warnings and problems come as text, or as objects carrying their text.
      function texts(list) {
        return (Array.isArray(list) ? list : [])
          .map((x) => (typeof x === "string" ? x : (x && (x.text || x.message)) || ""))
          .filter(Boolean);
      }

      function plural(n, word) {
        return n + " " + word + (n === 1 ? "" : "s");
      }

      function lastSentText(last) {
        if (!last) return "never";
        if (typeof last === "string") return last;
        if (last.unknown) return "unknown";
        const at = last.at || last.date || "";
        return at ? at + (last.by ? " by " + last.by : "") : "never";
      }

      function fromLine(from) {
        if (!from) return "";
        if (/no-reply/i.test(from)) return "From: " + from;
        return "From: ENCM Volunteer Kiosk, from a no-reply address (sent by " + from + ")";
      }

      // The email's total lines: the indented lines that open its body, or its one line
      // for a volunteer with no counted hours.
      function totalsLines(v) {
        if (Array.isArray(v.totals) && v.totals.every((t) => typeof t === "string")) {
          return v.totals;
        }
        const lines = String(v.body || "").split("\n");
        const start = lines.findIndex((l) => /^ {2}\S/.test(l));
        if (start === -1) {
          return lines.filter((l) => /recorded for you yet/.test(l));
        }
        const end = lines.findIndex((l, i) => i > start && !/^ {2}\S/.test(l));
        return lines.slice(start, end === -1 ? undefined : end).map((l) => l.trim());
      }

      // The flagged shifts a volunteer's warnings name, when the reply says: a count of
      // its own, or the counts on its Flags and Admin Alerts? warnings. null when unknown.
      function flaggedCount(v) {
        if (typeof v.flagged === "number") return v.flagged;
        const flags = (v.warnings || []).filter(
          (w) => w && typeof w.count === "number" && /flag|alert/i.test(w.kind || w.code || ""),
        );
        return flags.length ? flags.reduce((sum, w) => sum + w.count, 0) : null;
      }

      function addBlock(box, lines) {
        const block = document.createElement("div");
        block.textContent = lines.filter(Boolean).join("\n");
        box.appendChild(block);
        return block;
      }

      function drawPreview(reply) {
        const box = $("email-detail");
        box.textContent = "";
        const people = reply.volunteers || [];
        const will = reply.ticket ? (reply.sendIds || []).length : 0;
        addBlock(box, [
          ...texts(reply.setProblems),
          fromLine(reply.from),
          people.length +
            " ticked: " +
            will +
            " will be sent, " +
            (people.length - will) +
            " won't.",
        ]);
        people.forEach((v) => {
          const problems = texts(v.problems);
          const block = addBlock(box, [
            problems.length
              ? v.label + ": won't be sent. " + problems.join(" ")
              : "To: " + v.label + " <" + v.to + ">",
            v.profilesRow
              ? "Volunteer Profiles row " +
                v.profilesRow +
                (v.startDate ? " · started " + v.startDate : "")
              : "",
            "Last emailed: " + lastSentText(v.lastSent),
            ...totalsLines(v),
            v.attachment
              ? "Attached: " + v.attachment.name + " (" + plural(v.attachment.shifts, "shift") + ")"
              : "",
            ...texts(v.warnings).map((w) => "Check: " + w),
          ]);
          if (v.subject || v.body) {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = "Email text";
            const text = document.createElement("div");
            text.textContent = "Subject: " + (v.subject || "") + "\n\n" + (v.body || "");
            details.appendChild(summary);
            details.appendChild(text);
            block.appendChild(details);
          }
        });
        const warned = people.filter((v) => texts(v.warnings).length).length;
        if (warned) {
          const counts = people.map(flaggedCount).filter((n) => n !== null);
          const flagged = counts.reduce((sum, n) => sum + n, 0);
          $("email-check").textContent =
            "Check before sending: " +
            plural(warned, "volunteer") +
            (warned === 1 ? " has" : " have") +
            " something to check below" +
            (counts.length ? ", " + plural(flagged, "flagged shift") + " in all" : "") +
            ".";
          $("email-check").hidden = false;
        }
      }

      function previewed(id) {
        return ((shown && shown.volunteers) || []).find((v) => v.id === id) || null;
      }

      function resultLine(id, result) {
        const v = previewed(id);
        const label = v ? v.label : id;
        return result === "sent" ? label + ": sent to " + (v ? v.to : "") : label + ": " + result;
      }

      // A Send: the initials are read once, then the ticket's pending ids go to the server
      // in calls of chunkSize, one call at a time, in order.
      function send() {
        if (busy || running || !ticket) return;
        running = true;
        const initials = $("initials").value;
        run = { initials, total: ticket.pending.length, sent: 0, lines: [], recordFailed: false };
        buttonState();
        sendNext();
      }

      function sendNext() {
        run.ids = ticket.pending.slice(0, (shown && shown.chunkSize) || 10);
        show("Sending… " + (run.total - ticket.pending.length) + " of " + run.total, "info");
        const form = { ticket: ticket.id, ids: run.ids, initials: run.initials };
        call("adminSendHours", [form], () => {
          if (!running) show("", run.kind);
        });
      }

      // Runs on every email-mode reply, before the button is set; acts only on a send
      // reply. A reply that worked hands its results to the list and starts the next call,
      // or ends the run. A refusal or a thrown error ends the run; the ticket stays only for
      // BUSY and ADMIN_INITIALS, which come back before the server takes anything.
      function afterReply(name, reply, thrown, error) {
        if (name !== "adminSendHours" || !running) return;
        const ids = run.ids;
        if (!thrown && reply && reply.ok) {
          (reply.results || []).forEach((r) => {
            if (r.result === "sent") run.sent += 1;
            run.lines.push(resultLine(r.id, r.result));
          });
          if (reply.recordFailed) run.recordFailed = true;
          ticket.pending = ticket.pending.filter((id) => !ids.includes(id));
          if (ticket.pending.length) return sendNext();
          return endRun(false);
        }
        const why = thrown
          ? (error && error.message) || String(error)
          : (reply && reply.message) || "Something went wrong. Please try again.";
        ticket.pending.forEach((id) => {
          const lost = thrown && ids.includes(id);
          run.lines.push(
            resultLine(
              id,
              lost
                ? "not sent, or sent but the reply was lost: " +
                    why +
                    "; check the Hours emails tab before sending again"
                : "not sent: " + why,
            ),
          );
        });
        const code = !thrown && reply ? reply.refusal : "";
        const keep =
          (code === "BUSY" || code === "ADMIN_INITIALS") && selectionKey() === ticket.key;
        endRun(keep);
      }

      // Ends a send run: the result list in the preview box, and the count for the message
      // line.
      function endRun(keepTicket) {
        running = false;
        if (!keepTicket) setTicket("");
        const box = $("email-detail");
        box.textContent = "";
        addBlock(box, run.lines);
        const left = ((shown && shown.volunteers) || []).filter(
          (v) => !(shown.sendIds || []).includes(v.id),
        );
        if (left.length) {
          addBlock(box, [
            "Left out at Preview:",
            ...left.map((v) => v.label + ": " + (texts(v.problems).join(" ") || "not sendable")),
          ]);
        }
        $("email-check").hidden = true;
        const notSent = run.total - run.sent;
        let text = "Sent " + run.sent + " of " + run.total + ".";
        if (notSent) {
          text += " " + notSent + (notSent === 1 ? " wasn't" : " weren't") + " sent; see the list.";
        }
        if (run.recordFailed) {
          text +=
            " Some couldn't be written on the Hours emails tab; the execution log has the details.";
        }
        runCount = text;
        run.kind = notSent || run.recordFailed ? "error" : "ok";
      }

      function updateCount() {
        $("note-count").textContent = $("note").value.length + " / 500";
      }

      $(MODE).hidden = false;
      $("common").hidden = false;
      if (MODE === "remove") {
        $("note-label").innerHTML =
          'Reason <span class="hint">(required, kept on the Removed shifts tab)</span>';
      }
      if (MODE === "restore") $("note-block").hidden = true;
      if (MODE === "email") {
        $("note-block").hidden = true;
        $("save").textContent = "Send email";
        $("email-this").checked = true;
        $("email-attach").checked = false;
      }
      $("add-search").addEventListener("input", refill);
      $("fix-search").addEventListener("input", refill);
      $("remove-search").addEventListener("input", refill);
      $("restore-search").addEventListener("input", refill);
      $("email-search").addEventListener("input", refill);
      $("email-this").addEventListener("change", selectionChanged);
      $("email-last").addEventListener("change", selectionChanged);
      $("email-attach").addEventListener("change", selectionChanged);
      $("email-tick-all").addEventListener("click", tickAllShown);
      $("email-clear").addEventListener("click", clearTicks);
      $("email-preview").addEventListener("click", preview);
      $("remove-find").addEventListener("click", find);
      $("remove-shift").addEventListener("change", showDetail);
      $("restore-shift").addEventListener("change", showDetail);
      $("note").addEventListener("input", updateCount);
      $("save").addEventListener("click", save);
      $("close").addEventListener("click", () => google.script.host.close());
      document
        .querySelectorAll("form")
        .forEach((f) => f.addEventListener("submit", (event) => event.preventDefault()));
      load();
    </script>
  </body>
</html>
